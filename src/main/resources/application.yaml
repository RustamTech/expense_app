spring:
  application:
    name: coolproject

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expensedb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    # Entities never leave the service layer, so no lazy loading is needed in the web layer.
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  error:
    # Errors are rendered by GlobalExceptionHandler; never leak internals from the fallback page.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

# Required: no default secret, the application fails to start without JWT_SECRET.
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

logging:
  level:
    com.example.notes: INFO
